<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4efe6">
<title>Trip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<button id="menu-btn" type="button" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
<div id="menu" hidden><div class="scrim"></div><nav class="panel" aria-label="Views"></nav></div>
<header id="bar" aria-hidden="true">
  <button id="bar-title" type="button"></button>
  <button id="bar-hotel" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18.5v-9M3 15h18v3.5M21 15v-2.5a2.5 2.5 0 0 0-2.5-2.5H11v5M5 12.5V11a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 10 11v1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Hotel</button>
  <button id="bar-today" type="button" hidden>Now</button>
</header>
<main id="app"></main>
<main id="alt" hidden></main>
<div id="viewer" hidden role="dialog" aria-modal="true">
  <div class="v-top">
    <div class="v-head"><div class="v-kicker"></div><div class="v-title"></div></div>
    <button class="v-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="v-body"></div>
</div>
<div id="toast" hidden></div>
<div id="driver" hidden role="dialog" aria-modal="true"></div>
<div id="say" hidden role="dialog" aria-modal="true"></div>
<div id="search" hidden role="dialog" aria-modal="true" aria-label="Search the trip"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
