<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4efe6">
<title>Trip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="bar" aria-hidden="true">
  <button id="bar-title" type="button"></button>
  <button id="bar-today" type="button" hidden>Now</button>
</header>
<main id="app"></main>
<div id="viewer" hidden role="dialog" aria-modal="true">
  <div class="v-top">
    <div class="v-head"><div class="v-kicker"></div><div class="v-title"></div></div>
    <button class="v-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="v-body"></div>
</div>
<div id="toast" hidden></div>
<div id="driver" hidden role="dialog" aria-modal="true"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
