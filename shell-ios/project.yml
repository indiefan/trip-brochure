# xcodegen template; scripts/prepare.py fills the ${…} values from apps/<app>/app.json.
name: ${PRODUCT}
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  ${PRODUCT}:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: web
        type: folder
        buildPhase: resources
      - path: shell.json
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${TEAM}
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "${VERSION}"
        CURRENT_PROJECT_VERSION: "${BUILD}"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "${TITLE}"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        # Updates may come from a plain-http depot on the home network (or a Tailscale address): allowed. A public
        # https depot works regardless.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSRequiresIPhoneOS: true
