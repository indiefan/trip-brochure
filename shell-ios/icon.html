<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: M; src: url(icon-mincho.woff2); font-weight: 600; }
html,body{margin:0}
.i{width:1024px;height:1024px;position:relative;overflow:hidden;
  background: radial-gradient(120% 90% at 30% 15%, #d2583a 0%, #b8432c 45%, #8f2e1c 100%);}
.sun{position:absolute;left:50%;top:50%;width:700px;height:700px;margin:-350px 0 0 -350px;border-radius:50%;
  background: radial-gradient(circle at 40% 35%, rgba(255,214,170,.28), rgba(255,214,170,.08) 60%, rgba(255,214,170,0) 72%);}
.k{position:absolute;inset:0;display:grid;place-items:center;font:600 600px/1 M;color:#f6eee1;padding-bottom:40px;
  text-shadow: 0 10px 40px rgba(80,20,8,.35);}
.r{position:absolute;left:0;right:0;bottom:118px;text-align:center;font:600 54px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;letter-spacing:.42em;color:rgba(246,238,225,.82);padding-left:.42em}
</style></head><body><div class="i"><div class="sun"></div><div class="k">旅</div><div class="r">2026</div></div></body></html>
