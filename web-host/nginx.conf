server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # manifest.json and sw.js must never be cached by the browser: they are how the phone learns of a new version
  location ~ ^/(manifest\.json|sw\.js|index\.html)$ { add_header Cache-Control "no-cache"; }
  location ~ \.(jpg|png|woff2|js|css)$ { add_header Cache-Control "public, max-age=31536000"; }
  types { application/manifest+json webmanifest; }
}
