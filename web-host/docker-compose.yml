# Serve the built app as a web app from a NAS or Mac mini with Docker (see HANDBOOK.md → "Route A").
#   cp -r ../sample/dist ./dist        # or point the volume at your trip's dist/
#   docker compose up -d               # http://<this machine>:8080
# Phones need HTTPS for the offline part (the service worker): put Tailscale Serve, a Cloudflare Tunnel or any
# reverse proxy with a certificate in front of port 8080.
services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
